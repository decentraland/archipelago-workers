openapi: 3.1.0
info:
  title: Archipelago Stats API
  description: |
    ## Overview
    
    The Archipelago Stats API provides real-time visibility into the Decentraland communication system by aggregating peer heartbeats and the cluster topology published by Pulse. This API enables monitoring, debugging, and analytics of user distribution, island clustering, and system health across the metaverse.
    
    ### Purpose
    
    This service acts as an observability layer for the Archipelago protocol, transforming internal system state into queryable metrics and snapshots. It is designed for:
    
    - **Monitoring**: Track system health, user activity, and island distribution in real-time
    - **Analytics**: Analyze crowd patterns, popular areas, and user movement across parcels
    - **Debugging**: Inspect individual peer states, island configurations, and service availability
    - **Visualization**: Power dashboards and tools that display live metaverse activity
    
    ### Key Concepts
    
    **Parcels** represent geographic coordinates in Decentraland's 2D grid system. Each parcel has an X/Y coordinate, and the API provides peer density information per parcel, enabling identification of crowded areas and popular destinations.
    
    **Peers** are individual users/avatars currently active in the Archipelago system. Each peer entry includes their unique identifier, Ethereum address, real-time position coordinates (X, Y, Z), assigned island, and last heartbeat timestamp. This enables tracking of individual users and their current state in the system.
    
    **Islands** are dynamic clusters of peers that are continuously recalculated based on user positions. They group nearby users together to optimize message routing and rendering performance. Each island has center coordinates, a radius, and a list of all peers currently assigned to it. Island IDs read `C{n}` and `maxPeers` reads `0`: clusters are uncapped.

    ### How It Works

    Clustering is performed by **Pulse**, which publishes the topology this API serves. Pulse groups peers by adjacency over a 100-unit spatial grid, one realm at a time, with sticky cluster IDs and a dwell debounce so assignments do not flap. Clusters have no size limit — room capacity is handled downstream by comms-gatekeeper, which shards LiveKit rooms as needed.

    Until iteration 1 of the Archipelago ⇒ Pulse migration this was the `archipelago-core` service, which clustered by pairwise proximity with a 100-peer cap per island. That service has been removed.

    The Stats API continuously aggregates the published topology and provides it through REST endpoints with low latency, enabling real-time monitoring and analysis. Peer positions still come from client heartbeats.
    
    ### Data Freshness
    
    All data is provided in real-time and reflects the current state of the Archipelago system at the time of the API call. Island assignments, peer positions, and parcel densities are continuously updated as users move through the metaverse. The API does not provide historical data—each request returns the current snapshot of the system.
    
    ### Use Cases
    
    - **Live Dashboards**: Display real-time user distribution and popular areas
    - **System Monitoring**: Track service health, island counts, and user capacity
    - **Analytics Tools**: Analyze crowd patterns and identify trending scenes
    - **Developer Tools**: Debug communication issues and inspect peer connections
    - **Administrative Interfaces**: Monitor system load and user activity
    
    For detailed information about the Archipelago protocol architecture, see [ADR-204](https://adr.decentraland.org/adr/ADR-204).
